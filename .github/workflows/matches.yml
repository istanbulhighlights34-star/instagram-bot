name: Beşiktaş Maç Paylaşımları
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Instagram paylaşmadan önizleme oluştur'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: instagram-bot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  matches:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - run: pip install -r requirements.txt
      - name: Maçları kontrol et
        timeout-minutes: 7
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_SESSION: ${{ secrets.IG_SESSION }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          echo 'Kapsam: erkek futbol; erkek basketbol Avrupa maçları. Türkiye basketbol ligi veri kaynağı henüz bağlı değil.' >> "$GITHUB_STEP_SUMMARY"
          if [ "$DRY_RUN" = "true" ]; then
            python matches.py --dry-run
          else
            python matches.py
          fi
      - name: Önizlemeyi kaydet
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mac-onizleme
          path: preview/
          if-no-files-found: ignore
      - name: Maç paylaşım geçmişini kaydet
        if: always() && (github.event_name == 'schedule' || !inputs.dry_run)
        run: |
          if [ ! -f paylasilan_maclar.json ]; then exit 0; fi
          git config user.name 'Instagram Bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add paylasilan_maclar.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Save published match history'
          git pull --rebase origin main
          git push origin HEAD:main
