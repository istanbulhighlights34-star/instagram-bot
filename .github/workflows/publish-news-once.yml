name: Tek Seferlik Haber Paylaşımı
on:
  push:
    paths:
      - '.github/workflows/publish-news-once.yml'
permissions:
  contents: read
concurrency:
  group: instagram-bot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-news-once]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - run: pip install -r requirements.txt
      - name: Haber gönderisini paylaş
        timeout-minutes: 12
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_SESSION: ${{ secrets.IG_SESSION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: gemini-3.8-flash
        run: python publish_news_once.py
      - name: Görseli ve açıklamayı kaydet
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: haber-paylasimi
          path: published/
          if-no-files-found: ignore
      - name: Paylaşım geçmişini kaydet
        if: always()
        run: |
          touch paylasilan_haberler.txt kullanilan_yedek_gorseller.txt
          git config user.name 'Instagram Bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add paylasilan_haberler.txt kullanilan_yedek_gorseller.txt
          if [ -f kullanilan_oyuncu_gorselleri.json ]; then git add kullanilan_oyuncu_gorselleri.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Save approved news publication'
          git pull --rebase origin main
          git push origin HEAD:main
