services:
  - type: web
    name: kartalpenche-panel
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r panel/requirements.txt
    startCommand: gunicorn panel.app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: PANEL_SESSION_SECRET
        generateValue: true
      - key: PANEL_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
